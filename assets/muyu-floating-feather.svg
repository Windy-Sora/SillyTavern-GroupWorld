<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-88 -88 176 176">
<title>暮羽 · 星羽</title>
<defs>
<radialGradient id="haloPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#8f86ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8f86ff" stop-opacity="0"/>
    </radialGradient>
<linearGradient id="muyuPlume" x1="21" y1="45" x2="49" y2="13" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8c83df"/><stop offset=".35" stop-color="#b5a3f1"/><stop offset=".7" stop-color="#d9baf4"/><stop offset="1" stop-color="#fff0dd"/>
    </linearGradient>
<linearGradient id="muyuMoon" x1="23" y1="44" x2="39" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b2a8f0"/><stop offset=".55" stop-color="#a8d7f4"/><stop offset="1" stop-color="#e7e9ff"/>
    </linearGradient>
<linearGradient id="muyuShaft" x1="14" y1="52" x2="49" y2="13" gradientUnits="userSpaceOnUse">
