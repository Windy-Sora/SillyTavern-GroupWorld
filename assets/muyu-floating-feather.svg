        <g stroke="#f5edff" stroke-opacity=".36" stroke-width=".65" stroke-linecap="round" fill="none">
          <path d="M23 43c-1-5 1-10 4-14M29 36c0-4 2-8 5-12M28 39c5 0 10-2 14-5M34 32c5-1 9-3 12-7M40 24c4-2 7-5 9-9"/>
