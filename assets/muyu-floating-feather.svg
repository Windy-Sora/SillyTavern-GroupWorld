    </linearGradient>
<filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<g id="feather">
      <g transform="scale(2) rotate(-35) translate(-32 -32)">
        <path d="M18 48c0-9 4-18 11-25l-1 7c6-5 11-10 12-16l1 8c5-4 8-9 8-13 7 12 5 22-5 29l3-7c-5 9-15 15-29 17Z" fill="url(#muyuPlume)" stroke="#f0dfff" stroke-opacity=".5" stroke-width=".65" stroke-linejoin="round"/>
